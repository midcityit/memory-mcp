name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: [self-hosted, Linux, homelab]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest -v

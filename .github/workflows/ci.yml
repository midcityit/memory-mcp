name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: [self-hosted, linux, homelab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest -v

# SonarQube Community Build scan (MCIT-461, epic MCIT-457).
# Runs on the in-cluster runners (label mcit-k8s) so it can reach the server by
# its Service name; the public host (Access-protected) is not used by CI.
# Community Build analyzes the main branch only (no PR analysis), so this runs on
# pushes to main. The quality gate is REPORT-ONLY until the repo variable
# SONAR_ENFORCE is set to 'true', after which a failed gate fails the job.
name: SonarQube

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.repository }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: [self-hosted, mcit-k8s, amd64]
    timeout-minutes: 45
    continue-on-error: ${{ vars.SONAR_ENFORCE != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"  # same as ci.yml
          cache: "pip"
      # TEMP
      - name: TEMP disk before install
        run: |
          df -h / /tmp/runner/work || true
          du -sh ~/.cache/pip "$RUNNER_TEMP" 2>/dev/null || true
      - name: Install CPU-only torch (keeps disk small)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -e ".[dev]"
      # TEMP
      - name: TEMP disk after install
        run: |
          df -h / /tmp/runner/work || true
          du -sh ~/.cache/pip "$RUNNER_TEMP" 2>/dev/null || true
      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        run: pytest --cov --cov-report=xml:coverage.xml --cov-report=term
      - name: Warn if tests failed
        if: steps.tests.outcome == 'failure'
        run: echo "::warning::pytest failed; coverage may be partial (PR CI enforces tests)"
      # TEMP
      - name: TEMP show coverage.xml head
        run: head -c 900 coverage.xml; echo; grep -m3 -o 'filename="[^"]*"' coverage.xml
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.verbose=true # TEMP

name: Build kg-spike-pg (multi-arch)

# RCL-64 P0: source-controlled, genuinely multi-arch (amd64+arm64) build of the
# KG 2.0 Postgres image, so it can run on the prod arm64 pool (opi-5) as well as
# amd64. Manual dispatch + on changes to the image source.
#
# SPLIT BUILD: amd64 and arm64 build in parallel, each on its OWN native runner
# (no QEMU emulation) — much faster than one runner emulating the other arch.
# Each native job pushes a by-DIGEST image (no tag); the merge job then stitches
# the two digests into one multi-arch tag with `docker buildx imagetools create`.
env:
  IMAGE: acrmcit.azurecr.io/kg-spike-pg

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        default: "pg16-age-vector"
        required: true
  push:
    branches: ["main"]
    paths: ["images/kg-spike-pg/**", ".github/workflows/build-kg-spike-pg.yml"]

# OIDC token exchange for the runner pod's workload identity (ACR push auth).
permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner_arch: X64
          - arch: arm64
            runner_arch: ARM64
    # Native runner per arch: the matrix arch's own homelab runner, no emulation.
    runs-on: [self-hosted, linux, homelab, "${{ matrix.runner_arch }}"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # ACR auth via the runner pod's workload identity (id-github-runner-mcit,
      # AcrPush on acrmcit). No registry secrets. Same as openclaw-container.
      - name: Log in to ACR via workload identity
        run: |
          az login --service-principal \
            -u "$AZURE_CLIENT_ID" \
            --tenant "$AZURE_TENANT_ID" \
            --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" \
            --output none
          az acr login --name acrmcit

      # Build ONLY this runner's native platform and push by digest (no tag).
      # outputs push-by-digest=true writes the manifest digest to the registry
      # without a tag; the merge job references these digests to build the list.
      - name: Build & push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/kg-spike-pg
          file: images/kg-spike-pg/Dockerfile
          platforms: linux/${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # Hand the per-arch digest to the merge job via an artifact.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  merge:
    needs: [build]
    runs-on: [self-hosted, linux, homelab]
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR via workload identity
        run: |
          az login --service-principal \
            -u "$AZURE_CLIENT_ID" \
            --tenant "$AZURE_TENANT_ID" \
            --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" \
            --output none
          az acr login --name acrmcit

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      # Create the final multi-arch tag from the two by-digest images.
      - name: Create multi-arch manifest
        run: |
          TAG="${{ github.event.inputs.tag || 'pg16-age-vector' }}"
          AMD=$(cat /tmp/digests/amd64)
          ARM=$(cat /tmp/digests/arm64)
          echo "amd64=$AMD arm64=$ARM"
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            "${IMAGE}@${AMD}" "${IMAGE}@${ARM}"

      # VERIFY the published tag carries BOTH arches. Guards the TARGETARCH
      # default-shadow trap (a build can claim an arch yet ship another) and a
      # mis-wired merge. Fails unless both linux/amd64 and linux/arm64 are present.
      - name: Verify published arches
        run: |
          TAG="${{ github.event.inputs.tag || 'pg16-age-vector' }}"
          OUT=$(docker buildx imagetools inspect "${IMAGE}:${TAG}")
          echo "$OUT"
          echo "$OUT" | grep -q "linux/amd64" || { echo "MISSING linux/amd64"; exit 1; }
          echo "$OUT" | grep -q "linux/arm64" || { echo "MISSING linux/arm64"; exit 1; }
          echo "OK: both amd64 and arm64 present in the published manifest."

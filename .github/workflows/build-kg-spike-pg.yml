name: Build kg-spike-pg (multi-arch)

# RCL-64 P0: source-controlled, genuinely multi-arch (amd64+arm64) build of the
# KG 2.0 Postgres image, replacing the ad-hoc amd64-only spike image so it can
# run on the prod arm64 pool. Manual dispatch + on changes to the image source.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        default: "pg16-age-vector"
        required: true
  push:
    branches: ["main"]
    paths: ["images/kg-spike-pg/**", ".github/workflows/build-kg-spike-pg.yml"]

jobs:
  build-push:
    runs-on: [self-hosted, linux, homelab]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation for the non-native platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR (acrmcit)
        uses: docker/login-action@v3
        with:
          registry: acrmcit.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push multi-arch
        uses: docker/build-push-action@v7
        with:
          context: images/kg-spike-pg
          file: images/kg-spike-pg/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: acrmcit.azurecr.io/kg-spike-pg:${{ github.event.inputs.tag || 'pg16-age-vector' }}
          cache-from: type=registry,ref=acrmcit.azurecr.io/kg-spike-pg:buildcache
          cache-to: type=registry,ref=acrmcit.azurecr.io/kg-spike-pg:buildcache,mode=max

      # VERIFY the published manifest actually carries BOTH arches. Guards against
      # the TARGETARCH-default-shadow trap: a build can claim multi-arch yet ship
      # one arch. Fails the job unless both linux/amd64 and linux/arm64 are present.
      - name: Verify published arches
        run: |
          TAG="${{ github.event.inputs.tag || 'pg16-age-vector' }}"
          echo "Inspecting acrmcit.azurecr.io/kg-spike-pg:$TAG"
          OUT=$(docker buildx imagetools inspect "acrmcit.azurecr.io/kg-spike-pg:$TAG")
          echo "$OUT"
          echo "$OUT" | grep -q "linux/amd64" || { echo "MISSING linux/amd64"; exit 1; }
          echo "$OUT" | grep -q "linux/arm64" || { echo "MISSING linux/arm64"; exit 1; }
          echo "OK: both amd64 and arm64 present in the published manifest."
